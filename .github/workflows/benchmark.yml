name: Benchmark

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the workflow on benchmark gate violations"
        required: false
        default: false
        type: boolean

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Preserve checked-in benchmark baseline
        run: |
          mkdir -p benchmark-results
          cp benchmark-results/latest.json benchmark-results/baseline.json

      - name: Start kueue server
        run: |
          go build -o kueue .
          PORT=8080 KUEUE_DB_PATH=$(mktemp -d) ./kueue &>/tmp/kueue.log &
          echo "Server PID: $!"

          # Wait until port 8080 is accepting connections
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8080 > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start. Logs:"
          cat /tmp/kueue.log
          exit 1

      - name: Run full benchmark suite
        run: |
          go run ./cmd/bench \
            -targets=kueue \
            -messages=10000 \
            -producers=1 \
            -consumers=10 \
            -prefetch=10 \
            -runs=3 \
            -warmup=500 \
            -verify-order \
            -workload=full \
            -json-out=benchmark-results/latest.json
          cat benchmark-results/latest.json

      - name: Compare benchmark results
        env:
          BENCHMARK_STRICT: ${{ vars.BENCHMARK_STRICT }}
          WORKFLOW_DISPATCH_STRICT: ${{ inputs.strict }}
        run: |
          strict_arg=""
          if [ "${BENCHMARK_STRICT}" = "true" ] || [ "${WORKFLOW_DISPATCH_STRICT}" = "true" ]; then
            strict_arg="-strict"
          fi

          set +e
          go run ./cmd/benchcmp \
            -baseline=benchmark-results/baseline.json \
            -current=benchmark-results/latest.json \
            -summary-out=benchmark-results/comparison.md \
            ${strict_arg}
          status=$?
          cat benchmark-results/comparison.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark-results/latest.json
            benchmark-results/baseline.json
            benchmark-results/comparison.md